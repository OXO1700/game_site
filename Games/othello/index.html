<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Othello - GameDock Expert</title>
    <link rel="stylesheet" href="../../assets/style.css">
    <link rel="stylesheet" href="asset/style.css">
</head>
<body>
    <header id="common-header"></header>

    <main class="container" style="margin-top: 30px;">
        <h1 class="title">OTHELLO AI EXPERT</h1>

        <div class="game-layout">
            <div id="board-container">
                <div id="board"></div>
            </div>

            <div class="side-panel">
                <div id="status-text" class="status">ゲーム準備中...</div>
                
                <div class="analysis-section">
                    <div class="label-container">
                        <span class="label-side">黒有利</span>
                        <span class="label-center">|</span>
                        <span class="label-side">白有利</span>
                    </div>
                    <div class="eval-container">
                        <div id="eval-bar"></div>
                    </div>
                    <div id="eval-text">±0</div>
                </div>

                <div class="score-board">
                    <div class="score-box black-score">黒: <span id="count-black">2</span></div>
                    <div class="score-box white-score">白: <span id="count-white">2</span></div>
                </div>
                
                <div class="main-actions">
                    <button id="reset-btn" class="btn btn-danger">リセット</button>
                    <button id="analyze-btn" class="btn btn-purple">詳細分析</button>
                </div>

                <div class="base32-section">
                    <p class="label" style="font-size: 0.8rem; margin-bottom: 5px; color: #95a5a6;">盤面保存コード (Base32):</p>
                    <input type="text" id="code-output" readonly>
                    <div class="import-group" style="display: flex; gap: 8px; margin-top: 8px;">
                        <input type="text" id="code-input" placeholder="コードを貼り付け">
                        <button id="import-btn" class="btn btn-primary">復元</button>
                    </div>
                </div>
                
                <div class="train-section">
                    <button id="train-btn" class="btn btn-orange" style="width: 100%;">AIを100回自己学習させる</button>
                    <div id="progress-container" style="display: none;"><div id="progress-bar"></div></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // オセロページ用に調整した読み込み処理
        async function loadCommonHeader() {
   　　　 const headerElement = document.getElementById('common-header');
    try {
        const response = await fetch('../../assets/header.html');
        if (response.ok) {
            let html = await response.text();
            headerElement.innerHTML = html;

            // --- 追加：ヘッダーの全リンクを「トップページへの遷移」に変える ---
            const links = headerElement.querySelectorAll('a, .logo');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const genre = link.getAttribute('data-genre') || 'all';
                    // トップページへジャンル情報を付けて飛ばす
                    window.location.href = `../../index.html?genre=${encodeURIComponent(genre)}`;
                });
            });

            // 検索バーもトップページへ飛ばすようにする
            const searchInput = headerElement.querySelector('.search-input');
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    window.location.href = `../../index.html?search=${encodeURIComponent(searchInput.value)}`;
                }
            });
        }
    } catch (e) { console.error(e); }
}
loadCommonHeader();
    </script>
    <script src="asset/script.js"></script>
</body>
</html>
